l_korean:
 mhf_events.13.t: "피의 일요일"
 mhf_events.13.d: "일요일 오전, [SCOPE.sCountry('russia_scope').GetName]의 수도 [SCOPE.sState('moscow_scope').GetName]에서 임금 인상을 요구하는 시위대가 황제 [SCOPE.sCharacter('nicholas_scope').GetFullName]에게 청원서를 제출하기 위해 겨울 궁전으로 행진했다."
 mhf_events.13.a: "그들의 요구를 수락하라."
 mhf_events.13.b: "하느님이시여, [SCOPE.sCountry('russia_scope').GetName]을 보우하소서."
 mhf_events.13.c: "시위대를 해산시켜라."
 mhf_events.13.b.d: "근위대에게 시위대를 향해 발포 명령을 내립니다. \n#r 이 선택지는 예상치 못한 결과로 이어질 수도 있습니다...#!"
 mhf_events.14.t: "비창"
 mhf_events.14.d: "[SCOPE.sCountry('russia_scope').GetName]에서 일어난 사건으로 인해, [SCOPE.sCountry('russia_scope').GetName]의 노동자들의 분노는 점점 거세진다. 한편, [SCOPE.sCountry('russia_scope').GetName]로 귀국한 [SCOPE.sCharacter('lenin_scope').GetFullName]은 비밀리에 무장 혁명을 준비하기 시작한다."
 mhf_events.14.a: "폭풍전야다."
 mhf_events.15.t: "적백내전"
 mhf_events.15.d: "[SCOPE.sCharacter('lenin_scope').GetFullName]이 이끄는 소비에트 적위대가 [SCOPE.sCountry('russia_scope').GetName]의 대도시들에서 권력을 장악했다. [SCOPE.sCountry('russia_scope').GetName]의 미래는 그 어느 때보다 불확실해졌다."
 mhf_events.15.a: "만국의 노동자여, 단결하라!"
 mhf_events.15.a.d: "[SCOPE.sCharacter('lenin_scope').GetFullName]이 이끄는 소비에트 러시아를 플레이하게 됩니다.\n핀란드는 독립을 시도할 것이며, 중앙 러시아를 제외한 대부분의 지역을 백군 계열 정부들이 장악할 것입니다."
 mhf_events.15.b: "러시아는 불가분하다."
 mhf_events.15.b.d: "[SCOPE.sCharacter('kolchak_scope').GetFullName]가 이끄는 러시아국을 플레이하게 됩니다.\n핀란드는 독립을 시도할 것이며, 우크라이나 지역의 남러시아 총사령부, 발트해 주와 함께 적군에 맞서게 됩니다.\n내전이 종료된 후 차르의 복벽을 포기한다면 남러시아 총사령부를 합병할 수 있습니다."
 mhf_events.15.c: "."
 rus_cw: "적백내전"
 WRU: "러시아국"
 WRU_ADJ: "러시아국"
 SRU: "남러시아군 총사령부"
 SRU_ADJ: "남러시아군 총사령부"
 DON: "돈 공화국"
 DON_ADJ: "돈 공화국"
 CIR: "쿠반 공화국"
 CIR_ADJ: "쿠반 공화국"
 MAX: "마흐노우슈치나"
 MAX_ADJ: "마흐노우슈치나"
 trade_unions_boost_rus: "볼셰베키의 정권 장악"
 lenin_legitimacy_boost: "인민의 정통성"
 rcw_debuff: "혼란스러운 군사 조직"
 mhf_events.16.t: "붉은 군대"
 mhf_events.16.d: "[SCOPE.sCharacter('trotsky_scope').GetFullName]는 내전에서 승리하기 위해선 통제를 잃고 혼란에 빠진 현재의 적위대로선 역부족이란 것을 깨닫고, 새로운 군사조직인 붉은 군대를 창설하게 된다."
 mhf_events.16.f: "나는 귀하들에게 경고한다. 만약 어떤 부대라도 허가 없이 전선을 이탈할 경우, 부대의 정치장교는 처형될 것이다. 또한 지휘관도 처형될 것이다. 그리고 용맹한 병사가 새로이 지휘관으로 임명될 것이다. 겁쟁이, 이기주의자, 반역자는 총알로부터 도망치지 못할 것이다"
 mhf_events.16.a: "모든 소비에트의 노동자와 농민이 우리를 지지한다."
 red_army_boost: "붉은 군대"
 Anton: "안톤"
 mhf_events.17.t: "하얀 군대"
 white_army_boost: "하얀 군대"
 mhf_events.17.d: "혼란에 빠져 있던 군 조직은 [SCOPE.sCharacter('kolchak_scope').GetFullName]의 지휘 아래 재정비되었다. [SCOPE.sCountry('wru_scope').GetName]는 붉은 군대에 맞서 승리할 준비가 전부 되었다."
 mhf_events.17.a: "쓰러지지만, 지지 않았다."
 black_baron: "검은 남작"
 mhf_events.18.t: "소비에트의 승리"
 mhf_events.18.d: "[SCOPE.sCountry('russia_scope').GetName]을 지난 수 개월간 피로 물들인 내전은 소비에트의 승리로 끝맺었다. 하지만 아직 국가의 재건이라는 큰 과제가 소비에트 앞에 남아있다."
 mhf_events.18.a: "모든 인민의 승리다." 
 radical_population_fraction: "급진파 비율"
 mhf_events.19.t: "진정한 러시아의 승리"
 mhf_events.19.d: "[SCOPE.sCountry('wru_scope').GetName]는 드디어 소비에트 공산주의자의 반란을 제압하는 데에 성공했다. 이제 [SCOPE.sCharacter('ruler_scope').GetFullName]는 러시아의 미래를 결정해야 한다."
 mhf_events.19.a: "차르야말로 진정한 러시아 인민의 아버지이시다."
 mhf_events.19.a.d: "[SCOPE.sCharacter('ruler_scope').GetFullName]는 정계에서 은퇴하며, 차르가 러시아에 복귀합니다.\n[SCOPE.sCountry('sru_scope').GetName]의 공화주의자들은 이에 반대할 수도 있습니다."
 mhf_events.19.b: "러시아는 이제 민주공화국이다."  
 mhf_events.19.b.d: "러시아는 민주공화국을 선포합니다.\n[SCOPE.sCountry('sru_scope').GetName]는 그 선택을 지지하며, 기꺼이 합병될 것입니다."
 mhf_events.19.c: "나의 뜻이 곧 법이다"
 mhf_events.19.c.d: "[SCOPE.sCharacter('ruler_scope').GetFullName]는 독재정치를 선언합니다.\n[SCOPE.sCountry('sru_scope').GetName]는 이에 반대할 수도 있습니다."
 mhf_events.20.t: "레닌의 죽음"
 mhf_events.20.d: "[SCOPE.sCharacter('lenin_scope').GetFullName]이 혁명 당시 입은 총상의 후유증으로 사망하였다. 온 소비에트의 관심사는 그의 후계자가 누가 될지에 대해 달려있다."
 Ioseb: "이오시프"
 Stalin: "스탈린"
 mhf_events.20.a: "[SCOPE.sCharacter('stalin_scope').GetFullName]이 소비에트를 이끌 것이다."
 mhf_events.20.a.d: "[SCOPE.sCharacter('stalin_scope').GetFullName]이 소비에트의 새로운 지도자가 됩니다.\n그는 중공업을 육성하는 데에 집중할 것입니다."
 mhf_events.20.b: "[SCOPE.sCharacter('trotsky_scope').GetFullName]야말로 혁명을 이어갈 인재이다."
 mhf_events.20.b.d: "[SCOPE.sCharacter('trotsky_scope').GetFullName]이 소비에트의 새로운 지도자가 됩니다.\n그는 확률적으로 사회주의를 연구한 국가에서 쿠데타가 일어나 소비에트의 피보호국이 되게 합니다."
 mhf_events.21.t: "연속혁명: [SCOPE.sCountry('target_scope').GetName]"
 mhf_events.21.d: "[SCOPE.sCharacter('trotsky_scope').GetFullName]의 영구혁명론에 따르면, 세계 노동자 국가들의 생존을 위해선 지구 상에 브루주아 국가가 하나도 남지 않을 때까지 충분한 생산력을 갖춘 국가들이 앞장서 프롤레타리아 혁명을 일으켜야 한다. [SCOPE.sCountry('target_scope').GetName]에서의 혁명은 단지 그 증명의 시작일 뿐이다."
 rebuild_nation_rus: "국가 재건"
 five_year_plan_rus: "5개년 계획"
 mhf_events.24.t: "지중해로의 관문"
 mhf_events.24.d: "[SCOPE.sCountry('egypt_scope').GetName]와 [SCOPE.sCountry('turkey_scope').GetName] 사이의 전쟁의 결과로 서구 열강들은 오스만이 이집트에게 시리아와 수단, 팔레스타인에 대한 권리를 넘겨주는 대신, 다르다넬스 해협과 보스포루스 해협에 대한 베타적인 통제권을 공인하였다. 이는 러시아의 지중해 진출을 막으려는 [SCOPE.sCountry('uk_scope').GetName]과 여타 유럽 강대국들의 음모일 것이다."
 mhf_events.24.a: "그들의 통제권을 인정하라."
 mhf_events.24.b: "[SCOPE.sCountry('turkey_scope').GetName]을 압박해라"